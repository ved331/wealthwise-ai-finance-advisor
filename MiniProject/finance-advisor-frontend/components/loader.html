<div class="loader-container" id="global-app-loader">
    <div class="spinner"></div>
</div>

<style>
    .loader-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(2, 6, 23, 0.9);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        backdrop-filter: blur(5px);
        transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    .loader-container.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        display: none !important;
    }

    .spinner {
        width: 50px;
        height: 50px;
        border: 5px solid rgba(59, 130, 246, 0.2);
        border-top-color: var(--primary-color, #3b82f6);
        border-radius: 50%;
        animation: spin 1s linear infinite;
    }

    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }
</style>

<script>
    (function() {
        // Auto dismiss loader after 500ms
        setTimeout(function() {
            var loader = document.getElementById('global-app-loader');
            if (loader) {
                loader.classList.add('hidden');
            }
        }, 500);
    })();
</script>
