<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alerts & Notifications - FinAI</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <div id="loader-placeholder"></div>

    <div class="dashboard-layout">
        <!-- Sidebar placeholder -->
        <div id="sidebar-placeholder"></div>

        <main class="main-content">
            <div class="dashboard-header mb-4">
                <div>
                    <h1>Alerts & Notifications</h1>
                    <p>Stay updated on your financial activities and AI insights.</p>
                </div>
                <div class="user-actions">
                    <button class="btn btn-outline">Mark All as Read</button>
                </div>
            </div>

            <div id="alerts-container" style="max-width: 800px;">
                <!-- Alerts injected via JS -->
            </div>
        </main>
    </div>

    <script src="js/main.js"></script>
    <script src="js/alerts.js"></script>
</body>
</html>
