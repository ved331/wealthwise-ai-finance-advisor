<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - FinAI</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <div id="loader-placeholder"></div>

    <div class="dashboard-layout">
        <!-- Sidebar placeholder -->
        <div id="sidebar-placeholder"></div>

        <main class="main-content">
            <div class="dashboard-header">
                <div>
                    <h1>Overview</h1>
                    <p>Welcome back!</p>
                </div>
                <div class="user-actions">
                    <button class="btn btn-outline" style="border-radius: 50%; width: 40px; height: 40px; padding: 0;">👤</button>
                </div>
            </div>

            <div class="summary-cards">
                <div class="summary-card glass-panel animate-fade-in delay-100">
                    <span class="label">Total Balance</span>
                    <span class="value">$24,562.00</span>
                    <span class="trend up">▲ +2.5% this month</span>
                </div>
                <div class="summary-card glass-panel animate-fade-in delay-200">
                    <span class="label">Monthly Spending</span>
                    <span class="value">$3,210.50</span>
                    <span class="trend down">▼ -1.2% from last month</span>
                </div>
                <div class="summary-card glass-panel animate-fade-in delay-300">
                    <span class="label">Savings Goal</span>
                    <span class="value">$15,000</span>
                    <div style="width: 100%; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; margin-top: 10px;">
                        <div style="width: 65%; height: 100%; background: var(--primary-color); border-radius: 3px;"></div>
                    </div>
                    <span class="trend" style="color: var(--text-muted); margin-top: 5px;">65% Achieved</span>
                </div>
            </div>

            <div class="charts-grid">
                <div class="chart-card glass-panel animate-fade-in delay-100" id="portfolio-chart">
                    <h3>Portfolio Growth</h3>
                    <!-- Chart injected via JS -->
                </div>
                <div class="chart-card glass-panel animate-fade-in delay-200">
                    <h3>AI Insights (Live API)</h3>
                    <div id="ai-insights-container" style="margin-top: 20px;">
                        <div style="background: rgba(16, 185, 129, 0.1); border-left: 3px solid var(--success); padding: 15px; border-radius: 0 8px 8px 0; margin-bottom: 15px;">
                            <strong>💡 Loading Live Suggestions...</strong>
                        </div>
                    </div>
                    <a href="ai-chat.html" class="btn btn-outline" style="width: 100%; margin-top: 15px; display: block; text-align: center;">Ask Advisor</a>
                </div>
            </div>

            <div class="glass-panel animate-fade-in delay-300">
                <div style="padding: 20px; border-bottom: 1px solid var(--glass-border); display: flex; justify-content: space-between; align-items: center;">
                    <h3 style="margin: 0;">Recent Transactions</h3>
                    <a href="#" style="font-size: 0.9rem;">View All</a>
                </div>
                <div class="recent-transactions" id="transaction-list">
                    <!-- Transactions injected via JS -->
                </div>
            </div>
        </main>
    </div>

    <script src="config/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/main.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
